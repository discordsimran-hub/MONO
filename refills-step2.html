  <section class="section refill-page">
    <div class="container">
      <div class="refill-card">
        <h1>Refill Details</h1>
        <p class="refill-subtitle">Add your delivery details and send the refill request to us.</p>

        <div id="refill-summary" class="refill-summary"></div>

        <form id="refill-step2-form">
          <label>
            Address
            <textarea id="refill-address" name="address" placeholder="Your delivery address" rows="4" required></textarea>
          </label>

          <label>
            Email
            <input id="refill-email" name="email" type="email" placeholder="Your email address" required>
          </label>

          <button class="submit-btn" type="submit">Submit</button>
        </form>

        <p class="refill-message"></p>
      </div>
    </div>
  </section>
